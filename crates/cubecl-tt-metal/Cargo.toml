[package]
authors = ["carl <carl@example.com>"]
categories = ["science"]
description = "Tenstorrent TT-Metal runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "tenstorrent", "tt-metal"]
license.workspace = true
name = "cubecl-tt-metal"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-tt-metal"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
]

std = ["cubecl-runtime/std", "cubecl-common/std", "cubecl-core/std"]

tracing = [
    "dep:tracing",
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]


[dependencies]
# Runtime Deps
log = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

cubecl-common = { path = "../cubecl-common", version = "=0.11.0-pre.1", features = [
    "compilation-cache",
    "std",
    "hash",
] }
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.1", default-features = false }
cubecl-cpp = { path = "../cubecl-cpp", version = "=0.11.0-pre.1", default-features = false, features = [
    "tt_metal",
] }
cubecl-runtime = { path = "../cubecl-runtime", version = "=0.11.0-pre.1", default-features = false, features = [
    "channel-mutex",
] }

libtt-metal-cxx = { workspace = true }

bytemuck = { workspace = true }

derive-new = { workspace = true }
half = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
cubecl-core = { path = "../cubecl-core", version = "=0.11.0-pre.1", features = [
    "export_tests",
] }
cubecl-std = { path = "../cubecl-std", version = "=0.11.0-pre.1", features = [
    "export_tests",
] }
pretty_assertions = { workspace = true }
test-log = { workspace = true, features = ["trace"] }
